name: Deploy Infrastructure to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ==========================================
      # 🛡️ 【新規追加】Checkovによるセキュリティ自動監査
      # ==========================================
      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          # チェック対象とするCloudFormationテンプレートファイルを指定
          file: template_private_ssm.yaml
          # soft_fail: false にすることで、セキュリティ違反が見つかった場合にビルドを強制ストップさせます
          soft_fail: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

- name: Deploy CloudFormation Stack
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: PrivateSsmStack
        template: template_private_ssm.yaml
        capabilities: CAPABILITY_NAMED_IAM
        parameter-overrides: "CertificateArn=arn:aws:acm:ap-northeast-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"