AWSTemplateFormatVersion: '2010-09-09'
Description: Reliable CloudFormation template with SSM Parameter AMI Lookup

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

Resources:
  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: Private-SSM-Instance-Updated  # ← ここを変更してみる

  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: Private-SSM-Instance-Updated  # ← ここを変更してみる

  DemoInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Private-SSM-Instance-Updated  # ← ここを変更してみる

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVpc
      InternetGatewayId: !Ref DemoInternetGateway

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc

  DemoRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref DemoRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoInternetGateway

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DemoSubnet
      RouteTableId: !Ref DemoRouteTable

  Ec2SsmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2SsmRole

  TargetEc2:
    Type: AWS::EC2::Instance
    DependsOn: DemoSubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DemoSubnet
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          echo "SUCCESS: Text content read via SSM Run Command!" > /tmp/data.txt
      Tags:
        - Key: Name
          Value: Private-SSM-Instance-Updated  # ← ここを変更してみる

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SsmRunCommandPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource: "*"

  RunCommandLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref TargetEc2
          FILE_PATH: /tmp/data.txt
      Code:
        ZipFile: |
          const { SSMClient, SendCommandCommand, GetCommandInvocationCommand } = require("@aws-sdk/client-ssm");
          const ssmClient = new SSMClient({});
          exports.handler = async (event) => {
            const instanceId = process.env.INSTANCE_ID;
            const filePath = process.env.FILE_PATH;
            const sendCommand = new SendCommandCommand({
              InstanceIds: [instanceId],
              DocumentName: "AWS-RunShellScript",
              Parameters: { commands: [cat ] },
            });
            const sendResult = await ssmClient.send(sendCommand);
            const commandId = sendResult.Command?.CommandId;
            await new Promise((resolve) => setTimeout(resolve, 3000));
            const getInvocation = new GetCommandInvocationCommand({
              CommandId: commandId,
              InstanceId: instanceId,
            });
            const result = await ssmClient.send(getInvocation);
            return {
              statusCode: 200,
              instanceId,
              output: result.StandardOutputContent?.trim() || "",
            };
          };

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RunCommandLambda
      Principal: events.amazonaws.com

  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 0 * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RunCommandLambda.Arn
          Id: "LambdaTarget"

Outputs:
  LambdaArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt RunCommandLambda.Arn